name: Build and publish site image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 生成的页面要和原稿一致：改了 content/ 或 tools/ 却没重新生成提交，就不发布
      - name: Check generated pages are committed
        run: |
          python3 tools/build_pages.py
          git diff --exit-code

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: REVISION=${{ github.sha }}
          tags: |
            ghcr.io/dev-longshun/xianyu-zhikong-web:latest
            ghcr.io/dev-longshun/xianyu-zhikong-web:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
