# 闲鱼智控宣传页：纯静态，只读文件。
# 装到 shan-dmit-hk 的 /etc/nginx/sites-available/xianyu.dongeai.com，软链进 sites-enabled；
# HTTPS 由 `certbot --nginx -d xianyu.dongeai.com` 加到这个文件里（Cloudflare 灰云 A 记录 → 本机）。
# 本文件是 2026-10-29 certbot 改完后从服务器拉回的原样副本；在服务器上改了要同步回来，反之亦然。

server {
    server_name xianyu.dongeai.com;

    root /var/www/xianguanjia-web;
    index index.html;

    access_log /var/log/nginx/xianguanjia-web.access.log;
    error_log  /var/log/nginx/xianguanjia-web.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # nginx.conf 里只开了 gzip、没写 gzip_types，默认只压 HTML
    gzip_types text/css application/javascript image/svg+xml;

    # 页面本身每次都向服务器确认，改了文案马上生效
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 截图、字体、样式、脚本文件名不带哈希，缓存一天，换图后最迟一天全部更新
    location ~* \.(?:webp|woff2|css|js)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/xianyu.dongeai.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/xianyu.dongeai.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = xianyu.dongeai.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name xianyu.dongeai.com;
    return 404; # managed by Certbot


}