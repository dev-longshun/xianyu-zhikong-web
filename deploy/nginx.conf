# 闲鱼智控官网：宿主 nginx 只管 HTTPS、域名和访问日志，页面由容器 xianyu-web（127.0.0.1:8796）提供。
# 装在 shan-dmit-hk 的 /etc/nginx/sites-available/xianyu.dongeai.com，软链进 sites-enabled；
# HTTPS 由 `certbot --nginx -d xianyu.dongeai.com` 加到这个文件里（Cloudflare 灰云 A 记录 → 本机）。
# 缓存头、安全头在容器里（docker/nginx.conf）。2026-11-03 由直接托管 /var/www/xianguanjia-web 改为反代容器；
# 在服务器上改了要同步回来，反之亦然。

server {
    server_name xianyu.dongeai.com;

    access_log /var/log/nginx/xianguanjia-web.access.log;
    error_log  /var/log/nginx/xianguanjia-web.error.log;

    location / {
        proxy_pass http://127.0.0.1:8796;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/xianyu.dongeai.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/xianyu.dongeai.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = xianyu.dongeai.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name xianyu.dongeai.com;
    return 404; # managed by Certbot


}