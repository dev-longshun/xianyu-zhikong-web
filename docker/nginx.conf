# 容器内的 nginx：只管静态文件和缓存头。HTTPS、域名、访问日志在服务器的宿主 nginx（deploy/nginx.conf）。

# 请求头带 Accept: text/markdown 的（AI 助手），页面地址直接给同目录的 index.md
map $http_accept $wants_markdown {
    default 0;
    "~*text/markdown" 1;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain text/markdown;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 页面本身每次都向服务器确认，改了文案马上生效
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 每个页面的 Markdown 版本（tools/seo.py 生成）：/x/index.md 原样给；/x.md、/x/index.html.md 是常见的另两种写法
    location ~ \.md$ {
        types { }
        default_type "text/markdown; charset=utf-8";
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept" always;
        add_header X-Content-Type-Options "nosniff" always;
        rewrite ^(.*/)index\.html\.md$ $1index.md break;
        try_files $uri $uri/../index.md @md_dir;
    }
    location @md_dir {
        rewrite ^/(.+)\.md$ /$1/index.md break;
        types { }
        default_type "text/markdown; charset=utf-8";
        add_header Vary "Accept" always;
    }

    location = /llms.txt {
        types { }
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "no-cache" always;
    }

    location = /version.txt {
        add_header Cache-Control "no-store" always;
    }

    # 截图、字体、样式、脚本文件名不带哈希，缓存一天，换图后最迟一天全部更新
    location ~* \.(?:webp|woff2|css|js)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Vary "Accept" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        if ($wants_markdown) {
            rewrite ^(.*/)$ $1index.md last;
        }
        try_files $uri $uri/ =404;
    }
}
