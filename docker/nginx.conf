# 容器内的 nginx：只管静态文件和缓存头。HTTPS、域名、访问日志在服务器的宿主 nginx（deploy/nginx.conf）。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 页面本身每次都向服务器确认，改了文案马上生效
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /version.txt {
        add_header Cache-Control "no-store" always;
    }

    # 截图、字体、样式、脚本文件名不带哈希，缓存一天，换图后最迟一天全部更新
    location ~* \.(?:webp|woff2|css|js)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
